version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: esic_postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esic_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esic_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EXTERNAL_SERVICE_URL: ${EXTERNAL_SERVICE_URL}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    networks:
      - esic_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  external-service:
    build:
      context: .
      dockerfile: Dockerfile.external
    container_name: esic_external_service
    environment:
      APP_ENV: ${APP_ENV}
    ports:
      - "8001:8001"
    networks:
      - esic_network
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: esic_consumer
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./logs:/app/logs
    networks:
      - esic_network
    command: python consumer.py

volumes:
  postgres_data:

networks:
  esic_network:
    driver: bridge

